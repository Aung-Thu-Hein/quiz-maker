version: "3"

services: 
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./public:/quizmaker/public
    depends_on:
      - mysql
  php:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
  mysql:
    image: mariadb:latest
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
    volumes:
      - quizmaker:/var/lib/mysql
    ports:
      - 3307:3306
volumes:
  quizmaker: {}
